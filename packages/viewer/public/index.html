<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#131313" />
  <title>Relay</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============ LIVE ============ -->
  <main id="live" class="screen">
    <header class="hud">
      <span id="hudState" class="hud-state" data-state="off"><span class="hud-dot"></span><span id="hudText">CONNECTING</span></span>
      <span id="hudLangs" class="hud-langs"></span>
      <span id="hudClock" class="hud-clock mono">00:00:00</span>
      <button id="openDisplay" class="hud-aa" aria-label="Display settings">AA</button>
    </header>
    <section id="lines" class="lines" aria-live="polite"></section>
  </main>

  <!-- ============ DISPLAY SETTINGS ============ -->
  <section id="display" class="screen" hidden>
    <header class="hud hud-plain">
      <button id="closeDisplay" class="hud-back">← BACK</button>
      <span class="hud-right">DISPLAY</span>
    </header>
    <div id="previewRow" class="preview"></div>
    <div class="display-body">
      <div class="theme-bar" id="themeBar">
        <button data-theme="dark">Dark</button>
        <button data-theme="light">Light</button>
        <button data-theme="obs-black">OBS black</button>
        <button data-theme="obs-clear">OBS clear</button>
      </div>
      <div class="drow drow-size">
        <div class="drow-head"><span>Size</span><span id="sizeVal" class="mono dim">21</span></div>
        <div class="slider"><span class="a-sm">A</span><input id="setSize" type="range" min="14" max="40" step="1" /><span class="a-lg">A</span></div>
      </div>
      <label class="drow"><span>Show original</span><input id="setShowSource" type="checkbox" class="sq" /></label>
      <label class="drow"><span>Show translation</span><input id="setShowTranslation" type="checkbox" class="sq" /></label>
      <label class="drow"><span>Timestamps</span><input id="setTimestamps" type="checkbox" class="sq" /></label>
      <label class="drow"><span>Text shadow</span><input id="setShadow" type="checkbox" class="sq" /></label>
      <label class="drow drow-pick"><span>Font</span><span class="pick mono dim"><span id="fontVal">RELAY</span> ›</span>
        <select id="setFont">
          <option value="relay">Relay (Archivo)</option>
          <option value="system">System default</option>
          <option value="verdana">Verdana (clear)</option>
          <option value="georgia">Georgia (serif)</option>
          <option value="mono">Monospace</option>
          <option value="impact">Impact (bold)</option>
        </select>
      </label>
      <label class="drow drow-pick"><span>Alignment</span><span class="pick mono dim"><span id="alignVal">LEFT</span> ›</span>
        <select id="setAlign"><option value="left">Left</option><option value="center">Center</option></select>
      </label>
      <label class="drow drow-pick"><span>Lines kept</span><span class="pick mono dim"><span id="linesVal">8</span> ›</span>
        <select id="setLines"></select>
      </label>
      <div class="drow"><span>Colors</span>
        <span class="swatches">
          <label class="swatch" title="Text"><span id="swFg"></span><input id="setFg" type="color" /></label>
          <label class="swatch" title="Accent"><span id="swAccent"></span><input id="setAccent" type="color" /></label>
          <label class="swatch" title="Background"><span id="swBg"></span><input id="setBg" type="color" /></label>
        </span>
      </div>
    </div>
    <footer class="display-foot"><button id="resetStyle">RESET</button><span>SAVED ON THIS DEVICE</span></footer>
  </section>

  <!-- ============ ENDED ============ -->
  <section id="ended" class="screen" hidden>
    <header class="hud">
      <span class="hud-state" data-state="off"><span class="hud-dot"></span><span>OFF AIR</span></span>
      <span id="endedAt" class="hud-clock mono"></span>
    </header>
    <div class="ended-body">
      <div class="label">THIS LINK HAS ENDED</div>
      <h1 class="ended-title">The session was stopped, or a new link was made.</h1>
      <p class="ended-text">Ask the streamer for the current one. Your display settings are kept.</p>
      <div class="ended-actions">
        <button id="tryAgain" class="ink-cell">TRY AGAIN</button>
        <span id="savedCount" class="dim-cell">0 LINES SAVED</span>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
