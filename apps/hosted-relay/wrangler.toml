name = "callout-relay-hosted"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Omertaji@gmail.com. Pinned so a deploy never has to guess between accounts.
account_id = "c9b5a04c1a901e52c8d99c576ee55f90"

# The relay answers on its own name. supr.systems moved to Cloudflare DNS on
# 2026-09-06 for exactly this - a Worker custom domain needs the zone on
# Cloudflare, and a CNAME from another DNS host does not work.
#
# Cloudflare creates the DNS record itself, which is why the old
# relay -> 187.124.87.202 A record (the retired VPS) was deliberately not
# recreated during the migration: a custom domain cannot attach to a hostname
# that already has a conflicting record.
#
# workers_dev stays on. It is the fallback if anything about the custom domain
# goes wrong, and the desktop app can be moved across deliberately rather than
# being cut over by a deploy.
workers_dev = true

routes = [
  { pattern = "relay.supr.systems", custom_domain = true }
]

# The viewer page is the one the desktop app already ships. Serving it from the
# asset binding keeps it edge-cached and free, and keeps the page same-origin
# with its WebSocket - app.js builds the socket URL from location.host.
[assets]
directory = "../../packages/viewer/public"
binding = "ASSETS"
# The Worker decides, always. Without this Cloudflare serves any path that
# matches a file BEFORE the Worker runs, and its directory-index handling
# answered "/" with index.html - the viewer page - instead of letting the
# router serve home.html. It also meant /watch/<token> was reaching the page
# by luck rather than by routing. Caught by deploying; no unit test could see
# it, because the behaviour lives in the platform and not in the code.
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# new_sqlite_classes, not new_classes: SQLite-backed objects are what the
# current free tier covers, and this room's state is a single small record.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# POST /claim mints a room for anybody who asks. The rooms are worthless
# without their secrets and idle ones cost nothing, but an unthrottled mint
# endpoint is not something to discover after handing the URL out.
#
# The limit lives here rather than in the Worker because src/index.ts holds no
# state, deliberately - a counter up there would be per-isolate and per-colo,
# which is to say not a limit. `period` may only be 10 or 60.
#
# Five a minute per address: a streamer claims one room, ever, and the desktop
# app claims one on first run. Five leaves room for a retry and a second
# machine without leaving room for a script.
[[ratelimits]]
name = "CLAIM_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60
